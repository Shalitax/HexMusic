# ╔══════════════════════════════════════════════════════════════╗
# ║           HexMusic — Docker Compose para Dokploy             ║
# ╚══════════════════════════════════════════════════════════════╝
# Guía completa: docs/DOKPLOY.md
#
# Un único contenedor, igual que el egg de Pterodactyl: la imagen
# docker/Dockerfile incluye el bot, Lavalink y el cifrado de YouTube
# (yt-cipher). Lavalink escucha en 127.0.0.1 dentro del contenedor, así que
# no depende de nombres de servicio ni de redes entre contenedores (lo que
# provocaba "Cannot connect to host lavalink:2333").
#
# Antes de desplegar:
#  1. Environment: DISCORD_TOKEN y, para el panel, WEB_ENABLED=true,
#     WEB_PUBLIC_URL y WEB_CLIENT_SECRET (ver docs/DOKPLOY.md).
#  2. Domains: servicio "bot", puerto 8080, HTTPS activado.

services:
  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    # Tiempo para que el bot guarde la cola y cierre Lavalink al redesplegar.
    stop_grace_period: 30s
    expose:
      # Panel web. Mantén WEB_PORT=8080 (o no lo definas) y usa este puerto
      # al crear el dominio en Dokploy.
      - "8080"
    volumes:
      # Base de datos, biblioteca, token de YouTube, contraseñas generadas,
      # plugins y registros de Lavalink.
      - hexmusic-data:/app/data
    networks:
      # Permite que Traefik (Dokploy) llegue al panel web.
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  hexmusic-data:
